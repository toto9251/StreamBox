[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssto-dl"
version = "2.0.0"
description = "Interactive downloader for SerienStream.to"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "selectolax>=0.3.0",
    "patchright>=1.40.0",
    "questionary>=2.0.0",
    "rich>=13.0.0",
    "plyer>=2.1.0",
    "yt-dlp>=2024.0.0",
]

[project.scripts]
SerienStream = "main:main"
ssto-dl = "main:main"

[tool.setuptools]
py-modules = [
    "main",
    "menu",
    "pipeline",
    "scraper",
    "config",
    "settings",
    "search",
    "manual_auth",
]
